# Imagem da Evolution Go usada pelo DOC ADV (fork com o whatsmeow atualizado).
# Roda ao receber uma tag v*-docadv* ou à mão; publica em ghcr.io/hlspablo/evolution-go.
name: DOC ADV - imagem

on:
  push:
    tags:
      - "v*-docadv*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hlspablo/evolution-go
          tags: |
            type=ref,event=tag
            type=sha,prefix=docadv-
            type=raw,value=docadv-latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
